<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz | Student Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Student Quiz</span>
      <div class="d-flex align-items-center gap-3">
        <span class="text-muted">Student: <strong id="studentName"></strong></span>
        <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">

        <div id="loading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="mt-3 text-muted">Loading questions...</p>
        </div>

        <div id="loadError" class="alert alert-danger d-none" role="alert"></div>

        <div id="quizBox" class="card shadow-sm d-none">
          <div class="card-body p-4">
            <div class="d-flex justify-content-between mb-2">
              <span id="questionNumber" class="fw-semibold"></span>
              <span id="progressText" class="text-muted"></span>
            </div>
            <div class="progress mb-4" role="progressbar" aria-label="Quiz progress">
              <div id="progressBar" class="progress-bar" style="width: 0%"></div>
            </div>

            <h2 id="questionText" class="h5 mb-3"></h2>
            <div id="choices" class="list-group mb-3"></div>

            <div id="message" class="alert alert-warning d-none" role="alert"></div>

            <div class="text-end">
              <button id="nextBtn" class="btn btn-primary px-4">Next</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
