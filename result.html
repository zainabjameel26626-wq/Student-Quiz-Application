<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Result | Student Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-7">
        <div class="card shadow-sm">
          <div class="card-body p-4 text-center">
            <h1 class="h3 mb-1">Quiz result</h1>
            <p class="text-muted mb-4">Student: <strong id="studentName"></strong></p>

            <div class="row g-3 mb-4">
              <div class="col-12 col-sm-4">
                <div class="stat-box">
                  <div class="stat-value" id="score"></div>
                  <div class="text-muted">Score</div>
                </div>
              </div>
              <div class="col-12 col-sm-4">
                <div class="stat-box">
                  <div class="stat-value" id="total"></div>
                  <div class="text-muted">Questions</div>
                </div>
              </div>
              <div class="col-12 col-sm-4">
                <div class="stat-box">
                  <div class="stat-value" id="percentage"></div>
                  <div class="text-muted">Percentage</div>
                </div>
              </div>
            </div>

            <div id="status" class="alert" role="alert"></div>

            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center mt-4">
              <button id="tryAgainBtn" class="btn btn-primary px-4">Try Again</button>
              <button id="logoutBtn" class="btn btn-outline-secondary px-4">Logout</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
